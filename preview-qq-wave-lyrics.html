<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QQ Music 3D Wave Lyrics Preview</title>
    <style>
      :root {
        color-scheme: dark;
        --wave-blue: #6fe9ff;
        --wave-indigo: #2aa8c4;
        --wave-violet: #6aa7ff;
        --lyric: rgba(255, 255, 255, 0.96);
        --muted: rgba(255, 255, 255, 0.5);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
        font-family: Inter, "SF Pro Display", "Microsoft YaHei", system-ui, sans-serif;
        background: #040816;
      }

      .stage {
        position: relative;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        display: grid;
        place-items: center;
        isolation: isolate;
        background:
          radial-gradient(circle at 0% 50%, rgba(0, 22, 27, 0.88) 0 14%, rgba(5, 61, 72, 0.64) 30%, transparent 52%),
          radial-gradient(circle at 100% 50%, rgba(75, 226, 255, 0.28) 0 16%, rgba(30, 173, 202, 0.23) 34%, transparent 58%),
          radial-gradient(circle at var(--drift-a, 56%) 24%, rgba(99, 232, 255, 0.14), transparent 40%),
          linear-gradient(105deg, #07313b 0%, #126879 46%, #25aac2 100%);
      }

      .stage::after {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 4;
        pointer-events: none;
        background:
          linear-gradient(180deg, rgba(1, 12, 18, 0.22), transparent 18%, transparent 72%, rgba(1, 12, 18, 0.28)),
          radial-gradient(circle at 50% 52%, transparent 0 42%, rgba(0, 23, 33, 0.24) 100%);
      }

      #waterScene {
        position: absolute;
        inset: 0;
        z-index: -1;
      }

      .source {
        --source-size: clamp(320px, 36vw, 520px);
        position: absolute;
        top: 50%;
        width: var(--source-size);
        aspect-ratio: 1;
        border-radius: 50%;
        transform: translateY(-50%);
        background:
          radial-gradient(circle, rgba(1, 22, 27, 0.64) 0 38%, transparent 39%),
          repeating-radial-gradient(circle, rgba(7, 31, 39, 0) 0 16%, rgba(3, 30, 38, 0.22) 17% 18%, transparent 19% 29%);
        border: 1px solid rgba(134, 236, 255, 0.1);
        box-shadow:
          inset 0 0 42px rgba(0, 0, 0, 0.26),
          0 0 80px rgba(13, 103, 120, 0.24);
        opacity: 0.7;
        z-index: 1;
      }

      .source.left {
        left: calc(var(--source-size) * -0.55);
      }

      .source.right {
        right: calc(var(--source-size) * -0.55);
        opacity: 0.26;
        background:
          radial-gradient(circle, rgba(109, 234, 255, 0.12) 0 38%, transparent 39%),
          repeating-radial-gradient(circle, rgba(146, 244, 255, 0) 0 16%, rgba(167, 246, 255, 0.14) 17% 18%, transparent 19% 29%);
      }

      .ghost {
        position: absolute;
        left: 50%;
        top: 50%;
        z-index: 0;
        width: 100%;
        transform: translate(-50%, -50%);
        padding: 0 4vw;
        color: rgba(0, 35, 43, 0.28);
        text-shadow: 0 14px 22px rgba(0, 25, 31, 0.24);
        filter: blur(3px);
        font-size: clamp(6.2rem, 19vw, 19rem);
        font-weight: 900;
        letter-spacing: 0;
        line-height: 0.82;
        text-align: center;
        text-transform: uppercase;
        white-space: nowrap;
        user-select: none;
        pointer-events: none;
      }

      .content {
        position: relative;
        z-index: 3;
        width: min(1220px, calc(100vw - 40px));
        text-align: center;
      }

      .artist {
        margin: 0 0 clamp(18px, 3vh, 32px);
        color: rgba(210, 248, 255, 0.62);
        font-size: clamp(0.72rem, 1vw, 0.92rem);
        font-weight: 740;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .lyric {
        max-width: 14em;
        min-height: 2.2em;
        margin: 0 auto;
        display: grid;
        place-items: center;
        color: var(--lyric);
        font-size: var(--lyric-size, clamp(2.7rem, 7.2vw, 7.3rem));
        font-weight: 830;
        letter-spacing: 0;
        line-height: 1.05;
        white-space: nowrap;
        text-shadow:
          0 0 var(--glow, 30px) rgba(111, 233, 255, 0.44),
          0 18px 64px rgba(0, 29, 39, 0.58);
      }

      .lyric span {
        display: inline-block;
        opacity: var(--line-opacity, 1);
        transform: translate3d(0, var(--line-y, 0px), 0) scale(var(--lyric-scale, 1));
        transform-origin: center;
      }

      .hud {
        position: absolute;
        left: clamp(18px, 3vw, 40px);
        right: clamp(18px, 3vw, 40px);
        bottom: clamp(18px, 4vh, 42px);
        z-index: 6;
        display: flex;
        align-items: center;
        gap: 18px;
        color: rgba(255, 255, 255, 0.56);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .chrome {
        position: absolute;
        top: 18px;
        left: 22px;
        right: 24px;
        z-index: 7;
        display: flex;
        align-items: center;
        justify-content: space-between;
        color: rgba(214, 249, 255, 0.78);
        pointer-events: none;
      }

      .chrome__right {
        display: flex;
        align-items: center;
        gap: 22px;
        font-size: 18px;
        line-height: 1;
      }

      .chrome__chevron {
        width: 18px;
        height: 18px;
        border-right: 2px solid currentColor;
        border-bottom: 2px solid currentColor;
        transform: rotate(45deg);
        opacity: 0.78;
      }

      .play {
        width: 44px;
        height: 44px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 50%;
        color: white;
        background: rgba(255, 255, 255, 0.07);
        backdrop-filter: blur(18px);
        cursor: pointer;
      }

      .bar {
        flex: 1;
        height: 2px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.16);
        overflow: hidden;
      }

      .bar i {
        display: block;
        width: var(--progress, 0%);
        height: 100%;
        background: linear-gradient(90deg, var(--wave-blue), #b7f7ff, var(--wave-blue));
        box-shadow: 0 0 18px rgba(111, 233, 255, 0.52);
      }

      @media (max-width: 760px) {
        .ghost {
          font-size: clamp(4.2rem, 24vw, 9rem);
        }

        .lyric {
          width: calc(100vw - 44px);
          max-width: calc(100vw - 44px);
        }

        .source {
          --source-size: clamp(300px, 92vw, 460px);
        }
      }
    </style>
  </head>
  <body>
    <main class="stage" id="stage">
      <div class="chrome" aria-hidden="true">
        <span class="chrome__chevron"></span>
        <div class="chrome__right">
          <span>□</span>
          <span>−</span>
          <span>□</span>
          <span>×</span>
        </div>
      </div>

      <div id="waterScene" aria-hidden="true"></div>
      <div class="source left"></div>
      <div class="source right"></div>
      <div class="ghost" id="ghost"></div>

      <section class="content" aria-label="immersive lyric preview">
        <p class="artist">如果可以 · 韦礼安</p>
        <h1 class="lyric"><span id="lyricText"></span></h1>
      </section>

      <div class="hud">
        <button class="play" id="playButton" type="button" aria-label="play pause">II</button>
        <div class="bar"><i id="progress"></i></div>
        <span id="timeLabel">00:00</span>
      </div>
    </main>

    <script type="module">
      import * as THREE from "https://esm.sh/three@0.165.0";

      const lyrics = [
        { t: 0, text: "\u5982\u679c\u53ef\u4ee5", key: "\u5982\u679c" },
        { t: 4.2, text: "\u6211\u60f3\u548c\u4f60\u56de\u5230\u90a3\u5929\u76f8\u9047", key: "\u76f8\u9047" },
        { t: 8.4, text: "\u8ba9\u65f6\u95f4\u505c\u5728\u98ce\u5439\u8d77\u7684\u77ac\u95f4", key: "\u77ac\u95f4" },
        { t: 12.8, text: "\u6211\u4f1a\u6162\u6162\u8bf4\u51fa\u6ca1\u8bf4\u7684\u8bdd", key: "\u6162\u6162" },
        { t: 17.2, text: "\u4e16\u754c\u53ea\u5269\u4f60\u7684\u56de\u7b54", key: "\u56de\u7b54" },
        { t: 21.6, text: "\u628a\u6240\u6709\u9057\u61be\u90fd\u53d8\u6210\u661f\u5149", key: "\u661f\u5149" },
      ];

      const duration = 25.8;
      const stage = document.getElementById("stage");
      const mount = document.getElementById("waterScene");
      const lyricText = document.getElementById("lyricText");
      const ghost = document.getElementById("ghost");
      const progress = document.getElementById("progress");
      const timeLabel = document.getElementById("timeLabel");
      const playButton = document.getElementById("playButton");
      const requestedTime = Number(new URLSearchParams(window.location.search).get("time"));
      const initialTime = Number.isFinite(requestedTime) && requestedTime >= 0 ? requestedTime % duration : 0;

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 120);
      camera.position.set(0, 0, 16);
      camera.lookAt(0, 0, 0);

      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      mount.appendChild(renderer.domElement);

      const geometry = new THREE.PlaneGeometry(26, 15.5, 210, 124);

      const material = new THREE.ShaderMaterial({
        transparent: true,
        depthWrite: false,
        extensions: {
          derivatives: true,
        },
        uniforms: {
          uTime: { value: 0 },
          uPlaying: { value: 1 },
          uResolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
          uBlue: { value: new THREE.Color("#6fe9ff") },
          uIndigo: { value: new THREE.Color("#2aa8c4") },
          uViolet: { value: new THREE.Color("#6aa7ff") },
        },
        vertexShader: `
          uniform float uTime;
          uniform float uPlaying;
          varying vec2 vUv;
          varying vec3 vWorld;
          varying float vHeight;

          float wavePulse(vec2 p, vec2 source, float delay, float amp, float speed, float decay) {
            float d = distance(p, source);
            float travel = mod(uTime * speed + delay, 23.5);
            float q = d - travel;
            float width = 0.7 + delay * 0.018;
            float packet = exp(-(q * q) / (width * width));
            float attenuation = exp(-d * decay) / sqrt(d + 1.0);
            float carrier = cos(q * 5.25);
            float shoulder = exp(-(q * q) / 2.8) * 0.18;
            return (carrier * packet + shoulder * packet) * amp * attenuation;
          }

          float sourceWaves(vec2 p, vec2 source, float phaseShift, float gain) {
            float h = 0.0;
            for (int i = 0; i < 6; i++) {
              float idx = float(i);
              float amp = gain * (0.4 - idx * 0.034);
              float speed = 1.22 + idx * 0.035;
              float decay = 0.027 + idx * 0.0028;
              h += wavePulse(p, source, phaseShift + idx * 3.45, amp, speed, decay);
            }
            return h;
          }

          float waterHeight(vec2 p) {
            float h = 0.0;
            vec2 left = vec2(-13.0, 0.0);
            vec2 right = vec2(13.0, 0.0);

            h += sourceWaves(p, left, 0.0, 1.0);
            h += sourceWaves(p, right, 1.15, 0.82);
            h += sin(p.x * 0.72 + uTime * 0.33) * sin(p.y * 0.56 - uTime * 0.27) * 0.012;
            return h * mix(0.36, 1.0, uPlaying);
          }

          void main() {
            vUv = uv;
            vec3 pos = position;
            float h = waterHeight(pos.xy);
            float edgeLift = smoothstep(0.12, 1.0, abs(pos.x) / 13.0);
            vec2 leftDir = normalize(pos.xy - vec2(-13.0, 0.0));
            vec2 rightDir = normalize(pos.xy - vec2(13.0, 0.0));
            float leftWeight = 1.0 / (distance(pos.xy, vec2(-13.0, 0.0)) + 1.2);
            float rightWeight = 0.74 / (distance(pos.xy, vec2(13.0, 0.0)) + 1.2);
            pos.xy += (leftDir * leftWeight + rightDir * rightWeight) * h * 0.24;
            pos.z += h * 0.9 + edgeLift * 0.04;
            vHeight = h;
            vec4 world = modelMatrix * vec4(pos, 1.0);
            vWorld = world.xyz;
            gl_Position = projectionMatrix * viewMatrix * world;
          }
        `,
        fragmentShader: `
          uniform float uTime;
          uniform vec2 uResolution;
          uniform vec3 uBlue;
          uniform vec3 uIndigo;
          uniform vec3 uViolet;
          varying vec2 vUv;
          varying vec3 vWorld;
          varying float vHeight;

          float wavePulse(vec2 p, vec2 source, float delay, float amp, float speed, float decay) {
            float d = distance(p, source);
            float travel = mod(uTime * speed + delay, 23.5);
            float q = d - travel;
            float width = 0.7 + delay * 0.018;
            float packet = exp(-(q * q) / (width * width));
            float attenuation = exp(-d * decay) / sqrt(d + 1.0);
            float carrier = cos(q * 5.25);
            float shoulder = exp(-(q * q) / 2.8) * 0.18;
            return (carrier * packet + shoulder * packet) * amp * attenuation;
          }

          float crestPulse(vec2 p, vec2 source, float delay, float speed, float decay) {
            float d = distance(p, source);
            float travel = mod(uTime * speed + delay, 23.5);
            float q = d - travel;
            float packet = exp(-(q * q) / 1.65);
            float attenuation = exp(-d * decay) / sqrt(d + 1.0);
            return pow(max(0.0, cos(q * 5.25)), 8.0) * packet * attenuation;
          }

          float sourceWaves(vec2 p, vec2 source, float phaseShift, float gain) {
            float h = 0.0;
            for (int i = 0; i < 6; i++) {
              float idx = float(i);
              float amp = gain * (0.4 - idx * 0.034);
              float speed = 1.22 + idx * 0.035;
              float decay = 0.027 + idx * 0.0028;
              h += wavePulse(p, source, phaseShift + idx * 3.45, amp, speed, decay);
            }
            return h;
          }

          float crestField(vec2 p, vec2 source, float phaseShift, float gain) {
            float c = 0.0;
            for (int i = 0; i < 6; i++) {
              float idx = float(i);
              float speed = 1.22 + idx * 0.035;
              float decay = 0.027 + idx * 0.0028;
              c += crestPulse(p, source, phaseShift + idx * 3.45, speed, decay) * gain * (1.0 - idx * 0.075);
            }
            return c;
          }

          void main() {
            vec2 p = vWorld.xy;
            vec3 n = normalize(vec3(-dFdx(vHeight) * 8.0, -dFdy(vHeight) * 8.0, 1.0));
            vec3 lightDir = normalize(vec3(-0.38, 0.42, 0.82));
            vec3 viewDir = normalize(vec3(0.0, 0.0, 12.0) - vWorld);

            float fresnel = pow(1.0 - max(dot(n, viewDir), 0.0), 2.2);
            float diffuse = max(dot(n, lightDir), 0.0);
            float spec = pow(max(dot(reflect(-lightDir, n), viewDir), 0.0), 42.0);
            float sourceFalloff = exp(-distance(p, vec2(-13.0, 0.0)) * 0.2) + exp(-distance(p, vec2(13.0, 0.0)) * 0.2);

            float caustic = pow(abs(sin(vHeight * 24.0 + uTime * 1.2)), 9.0);
            float ringEnergy = smoothstep(0.03, 0.24, abs(vHeight));
            float crest = crestField(p, vec2(-13.0, 0.0), 0.0, 1.0) + crestField(p, vec2(13.0, 0.0), 1.15, 0.82);
            vec3 base = mix(uBlue, uViolet, smoothstep(-4.5, 4.5, p.x));
            base = mix(base, uIndigo, 0.42 + sin(uTime * 0.16) * 0.1);

            float alpha = 0.09 + fresnel * 0.16 + ringEnergy * 0.08 + crest * 0.28 + sourceFalloff * 0.05;
            vec3 color = base * (0.42 + diffuse * 0.38 + fresnel * 0.72);
            color += vec3(0.9, 0.96, 1.0) * spec * 0.82;
            color += mix(uBlue, uViolet, vUv.x) * caustic * 0.18 * ringEnergy;
            color += vec3(0.82, 0.94, 1.0) * crest * 0.38;

            gl_FragColor = vec4(color, clamp(alpha, 0.08, 0.62));
          }
        `,
      });

      const water = new THREE.Mesh(geometry, material);
      water.position.z = -1.25;
      scene.add(water);

      const sourceGeometry = new THREE.SphereGeometry(0.07, 24, 12);
      const sourceMaterial = new THREE.MeshBasicMaterial({ color: "#a9f6ff", transparent: true, opacity: 0.42 });
      const leftSource = new THREE.Mesh(sourceGeometry, sourceMaterial);
      const rightSource = new THREE.Mesh(sourceGeometry, sourceMaterial.clone());
      leftSource.position.set(-12.95, 0, -0.92);
      rightSource.position.set(12.95, 0, -0.92);
      scene.add(leftSource, rightSource);

      let playing = true;
      let start = performance.now() - initialTime * 1000;
      let pauseAt = initialTime;
      let lastIndex = -1;
      let currentLyric = "";

      playButton.addEventListener("click", () => {
        playing = !playing;
        playButton.textContent = playing ? "II" : ">";
        material.uniforms.uPlaying.value = playing ? 1 : 0;
        if (playing) start = performance.now() - pauseAt * 1000;
      });

      function activeLyric(time) {
        let index = 0;
        for (let i = 0; i < lyrics.length; i += 1) {
          if (lyrics[i].t <= time) index = i;
        }
        return { line: lyrics[index], index };
      }

      function formatTime(time) {
        const seconds = Math.floor(time % 60).toString().padStart(2, "0");
        return `00:${seconds}`;
      }

      function fitLyricSize(text) {
        const chars = Math.max(4, Array.from(text).length);
        const usableWidth = Math.min(window.innerWidth - 44, 1180);
        const desktopCap = Math.min(window.innerWidth * 0.072, 116);
        const mobileCap = 58;
        const cap = window.innerWidth < 760 ? mobileCap : desktopCap;
        const widthFactor = window.innerWidth < 760 ? 1.55 : 0.88;
        const fitted = usableWidth / (chars * widthFactor);
        const size = Math.max(24, Math.min(cap, fitted));
        stage.style.setProperty("--lyric-size", `${size.toFixed(1)}px`);
        stage.style.setProperty("--lyric-scale", "1");

        requestAnimationFrame(() => {
          const maxWidth = window.innerWidth < 760 ? window.innerWidth - 44 : Math.min(window.innerWidth - 90, 1180);
          const renderedWidth = lyricText.scrollWidth;
          const scale = renderedWidth > 0 ? Math.min(1, maxWidth / renderedWidth) : 1;
          stage.style.setProperty("--lyric-scale", scale.toFixed(3));
        });
      }

      function onResize() {
        const width = window.innerWidth;
        const height = window.innerHeight;
        camera.aspect = width / height;
        camera.updateProjectionMatrix();
        renderer.setSize(width, height);
        material.uniforms.uResolution.value.set(width, height);
        if (currentLyric) fitLyricSize(currentLyric);
      }

      window.addEventListener("resize", onResize);

      function frame(now) {
        const elapsed = playing ? ((now - start) / 1000) % duration : pauseAt;
        if (playing) pauseAt = elapsed;

        const { line, index } = activeLyric(elapsed);
        if (index !== lastIndex) {
          lastIndex = index;
          currentLyric = line.text;
          lyricText.textContent = line.text;
          ghost.textContent = line.key;
          fitLyricSize(line.text);
        }

        const phase = elapsed - line.t;
        const opacity = Math.min(1, phase / 0.7);
        const lift = Math.max(0, 1 - phase / 0.85);
        const drift = Math.sin(elapsed * 0.18) * 4;
        const glow = 30 + Math.sin(elapsed * 1.6) * 11;

        stage.style.setProperty("--line-opacity", opacity.toFixed(3));
        stage.style.setProperty("--line-y", `${(30 * lift).toFixed(1)}px`);
        stage.style.setProperty("--drift-a", `${24 + drift}%`);
        stage.style.setProperty("--drift-b", `${76 - drift}%`);
        stage.style.setProperty("--glow", `${glow.toFixed(1)}px`);
        stage.style.setProperty("--progress", `${(elapsed / duration) * 100}%`);
        timeLabel.textContent = formatTime(elapsed);

        material.uniforms.uTime.value = elapsed;
        const breathe = 1 + Math.sin(elapsed * 2.2) * 0.24;
        leftSource.scale.setScalar(breathe);
        rightSource.scale.setScalar(1.08 + Math.cos(elapsed * 2.0) * 0.2);
        renderer.render(scene, camera);
        requestAnimationFrame(frame);
      }

      onResize();
      requestAnimationFrame(frame);
    </script>
  </body>
</html>
